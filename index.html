<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Генератор маркетинговых постов</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #1a1d29;
    --accent: #6c5ce7;
    --accent2: #00d2a0;
    --text: #eef0f6;
    --muted: #9096ab;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(160deg, #0f1117, #171a24);
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  p.subtitle { color: var(--muted); margin-top: 0; font-size: 14px; }

  .card {
    background: var(--card);
    border-radius: 14px;
    padding: 18px;
    margin-top: 18px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.25);
  }

  textarea {
    width: 100%;
    min-height: 100px;
    background: #12141d;
    border: 1px solid #2a2e3d;
    border-radius: 10px;
    color: var(--text);
    padding: 12px;
    font-size: 15px;
    resize: vertical;
  }
  textarea:focus { outline: none; border-color: var(--accent); }

  button {
    margin-top: 12px;
    background: linear-gradient(120deg, var(--accent), #a29bfe);
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }

  .status { margin-top: 10px; font-size: 13px; color: var(--muted); min-height: 18px; }
  .status.error { color: var(--danger); }

  .result-box {
    margin-top: 14px;
    background: #12141d;
    border-left: 3px solid var(--accent2);
    padding: 14px;
    border-radius: 8px;
    white-space: pre-wrap;
    font-size: 14.5px;
    line-height: 1.5;
    display: none;
  }

  .history-item {
    border-bottom: 1px solid #262a38;
    padding: 12px 0;
  }
  .history-item:last-child { border-bottom: none; }
  .history-prompt { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .history-result { font-size: 14px; white-space: pre-wrap; }
  .history-date { font-size: 11px; color: #545a70; margin-top: 6px; }

  .section-title {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .refresh-btn {
    background: none;
    width: auto;
    padding: 4px 10px;
    font-size: 12px;
    color: var(--accent2);
    margin: 0;
  }
  .empty { color: var(--muted); font-size: 13px; padding: 8px 0; }

  code.uid { color: var(--accent2); font-size: 11px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>AI Генератор маркетинговых постов</h1>
  <p class="subtitle">Опишите товар — получите готовый пост. История хранится в базе на сервере, привязана к вашему ID в браузере (<code class="uid" id="uidDisplay"></code>).</p>

  <div class="card">
    <textarea id="promptInput" placeholder="Например: беспроводные наушники с шумоподавлением, 30 часов работы, водозащита IPX5..."></textarea>
    <button id="generateBtn">Сгенерировать пост</button>
    <div class="status" id="statusText"></div>
    <div class="result-box" id="resultBox"></div>
  </div>

  <div class="card">
    <div class="section-title">
      <span>История запросов</span>
      <button class="refresh-btn" id="refreshBtn">Обновить</button>
    </div>
    <div id="historyList"></div>
  </div>
</div>

<script>
  const API_BASE = ""; // если фронтенд на другом хосте, укажи здесь полный URL бэкенда, напр. "https://your-app.onrender.com"

  function getUserId() {
    let id = localStorage.getItem("ai_app_user_id");
    if (!id) {
      id = "u_" + Math.random().toString(36).slice(2) + Date.now().toString(36);
      localStorage.setItem("ai_app_user_id", id);
    }
    return id;
  }

  const userId = getUserId();
  document.getElementById("uidDisplay").textContent = userId.slice(0, 10) + "...";

  const promptInput = document.getElementById("promptInput");
  const generateBtn = document.getElementById("generateBtn");
  const statusText = document.getElementById("statusText");
  const resultBox = document.getElementById("resultBox");
  const historyList = document.getElementById("historyList");
  const refreshBtn = document.getElementById("refreshBtn");

  function setStatus(msg, isError) {
    statusText.textContent = msg || "";
    statusText.className = "status" + (isError ? " error" : "");
  }

  function formatDate(iso) {
    try {
      const d = new Date(iso);
      return d.toLocaleString();
    } catch (e) {
      return iso;
    }
  }

  async function generate() {
    const prompt = promptInput.value.trim();
    if (!prompt) {
      setStatus("Введите описание товара.", true);
      return;
    }
    generateBtn.disabled = true;
    setStatus("Генерируем... это может занять до 30 секунд.");
    resultBox.style.display = "none";

    try {
      const res = await fetch(API_BASE + "/generate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt, user_id: userId }),
      });
      const data = await res.json();

      if (!res.ok) {
        setStatus(data.error || "Ошибка генерации.", true);
        return;
      }

      resultBox.textContent = data.result;
      resultBox.style.display = "block";
      setStatus("Готово.");
      promptInput.value = "";
      loadHistory();
    } catch (err) {
      setStatus("Не удалось связаться с сервером: " + err.message, true);
    } finally {
      generateBtn.disabled = false;
    }
  }

  async function loadHistory() {
    historyList.innerHTML = '<div class="empty">Загрузка...</div>';
    try {
      const res = await fetch(API_BASE + "/history?user_id=" + encodeURIComponent(userId));
      const items = await res.json();

      if (!Array.isArray(items) || items.length === 0) {
        historyList.innerHTML = '<div class="empty">Пока нет запросов.</div>';
        return;
      }

      historyList.innerHTML = "";
      for (const item of items) {
        const div = document.createElement("div");
        div.className = "history-item";
        div.innerHTML = `
          <div class="history-prompt">Запрос: ${escapeHtml(item.prompt)}</div>
          <div class="history-result">${escapeHtml(item.result)}</div>
          <div class="history-date">${formatDate(item.created_at)}</div>
        `;
        historyList.appendChild(div);
      }
    } catch (err) {
      historyList.innerHTML = '<div class="empty">Не удалось загрузить историю.</div>';
    }
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  generateBtn.addEventListener("click", generate);
  refreshBtn.addEventListener("click", loadHistory);

  loadHistory();
</script>
</body>
</html>
